<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compiler Visualizer</title>

<style>
body {
  font-family: Consolas, monospace;
  background: #1e1e1e;
  color: #fff;
}

.container {
  width: 85%;
  margin: auto;
  margin-top: 30px;
}

textarea {
  width: 100%;
  height: 160px;
  padding: 10px;
  background: #252526;
  color: #fff;
  border: none;
  resize: vertical;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  background: #007acc;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background:#005a9e;
}

.section {
  margin-top: 20px;
  background: #252526;
  padding: 15px;
  border-radius: 6px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border: 1px solid #444;
  padding: 8px;
}

th {
  background: #333;
}

/* Token Colors */
.keyword { color: #569cd6; }
.identifier { color: #9cdcfe; }
.number { color: #b5cea8; }
.operator { color: #d4d4d4; }
.delimiter { color: #dcdcaa; }
.invalid { color: red; }

/* Tree */
.tree {
  background: #111;
  padding: 10px;
  white-space: pre;
  border-left: 4px solid #007acc;
  border-radius: 4px;
}

/* Code blocks */
pre {
  background: #111;
  padding: 10px;
  border-radius: 4px;
  overflow-x: auto;
}
</style>
</head>

<body>

<div class="container">
<h1>Compiler Visualizer</h1>

<textarea id="code" placeholder="Enter C-like code..."></textarea>
<button onclick="runCompiler()">Run</button>

<!-- LEXEMES -->
<div class="section">
<h3>Lexemes</h3>
<ul id="lexemeList"></ul>
</div>

<!-- TOKENS -->
<div class="section">
<h3>Tokens</h3>
<table>
<thead>
<tr>
<th>Lexeme</th>
<th>Token Type</th>
</tr>
</thead>
<tbody id="tokenTable"></tbody>
</table>
</div>

<!-- PARSE TREE -->
<div class="section">
<h3>Final Parse Tree</h3>
<div id="parseTree"></div>
</div>

<!-- INTERMEDIATE -->
<div class="section">
<h3>Intermediate Code</h3>
<pre id="ic"></pre>
</div>

<!-- OPTIMIZED -->
<div class="section">
<h3>Optimized Code</h3>
<pre id="opt"></pre>
</div>

<!-- FINAL -->
<div class="section">
<h3>Final Code</h3>
<pre id="final"></pre>
</div>

<!-- OTHER -->
<div class="section">
<h3>Messages</h3>
<pre id="output"></pre>
</div>

</div>

<script>
async function runCompiler() {
  const code = document.getElementById("code").value;

  try {
    const res = await fetch("/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code })
    });

    const data = await res.json();
    parseOutput(data.output);

  } catch (err) {
    document.getElementById("output").textContent =
      "❌ Server Error\n" + err.message;
  }
}

function parseOutput(output) {

  const lines = output.split("\n");

  const lexemeList = document.getElementById("lexemeList");
  const tokenTable = document.getElementById("tokenTable");
  const parseTree = document.getElementById("parseTree");
  const ic = document.getElementById("ic");
  const opt = document.getElementById("opt");
  const final = document.getElementById("final");
  const other = document.getElementById("output");

  // Reset
  lexemeList.innerHTML = "";
  tokenTable.innerHTML = "";
  parseTree.innerHTML = "";
  ic.textContent = "";
  opt.textContent = "";
  final.textContent = "";
  other.textContent = "";

  let mode = "";
  let treeBuffer = "";

  lines.forEach(line => {
    const raw = line;
    line = line.trim();

    // MODES
    if (line === "=== TOKENS ===") { mode = "token"; return; }
    if (line === "=== FINAL PARSE TREE ===") { mode = "tree"; return; }
    if (line === "=== INTERMEDIATE CODE ===") { mode = "ic"; return; }
    if (line === "=== OPTIMIZED CODE ===") { mode = "opt"; return; }
    if (line === "=== FINAL CODE ===") { mode = "final"; return; }

    if (line.startsWith("===")) {
      mode = "other";
      return;
    }

    // TOKENS
    if (mode === "token" && line !== "") {
      const parts = line.split("->");
      if (parts.length < 2) return;

      const lex = parts[0].trim();
      const type = parts[1].trim();

      const li = document.createElement("li");
      li.textContent = lex;
      lexemeList.appendChild(li);

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${lex}</td>
        <td class="${type.toLowerCase()}">${type}</td>
      `;
      tokenTable.appendChild(row);
    }

    // TREE
    else if (mode === "tree") {
      treeBuffer += raw + "\n";
    }

    // IC
    else if (mode === "ic") {
      ic.textContent += raw + "\n";
    }

    // OPT
    else if (mode === "opt") {
      opt.textContent += raw + "\n";
    }

    // FINAL
    else if (mode === "final") {
      final.textContent += raw + "\n";
    }

    // OTHER
    else {
      other.textContent += raw + "\n";
    }

  });

  // Render tree
  if (treeBuffer.trim() !== "") {
    const div = document.createElement("div");
    div.className = "tree";
    div.textContent = treeBuffer;
    parseTree.appendChild(div);
  }
}
</script>

</body>
</html>
